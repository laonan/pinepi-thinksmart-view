[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinepi-hub"
version = "0.1.0.dev0"
description = "PinePi Home LAN message gateway with v2 notifications"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=14,<17",
    "zeroconf>=0.148,<1",
    "ifaddr>=0.2,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2", "setuptools>=75"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

